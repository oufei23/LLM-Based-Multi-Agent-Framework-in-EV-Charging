# config.yaml
Basic_Model_Config:
  model: "glm-4"
  API_KEY: "YOUR_API_KEY"
  API_BASE_URL: "your_BASE_URL"




prompt_templates:

  user_template: |
    """
    你是一名电车充电服务的AI助手，请根据用户输入 {query} 以及用户反馈 {feedback} ，严格按照以下JSON Schema{json_shema} 输出参数
    请注意不要预设任何信息,不要将任何explanation信息包含在输出中的json文件中
    
    example output
    {{'持续时长': 9, '目标电量': 90, '期望续航': 100, '快慢充偏好': True, '用户预算': 220}}
    """
  ev_template: |
    """
    你是一名电车充电服务的AI助手，请根据用户输入 {query} 以及数据库中提取到的电车相关参数信息 {context} ，严格按照以下JSON Schema{json_shema} 输出
    请注意不要预设任何信息,不要将任何explanation信息包含在输出中的json文件中
    
    example output:
    
    ```json
    {{'品牌型号': '比亚迪海豹500km','电池容量': 61.4,'续航里程': 550,'快充支持': True,'慢充支持': True}}
    ```
    """

  get_modeling_template: |
    """
    你是一名在电车充电领域帮助提取建模参数的AI助手，请根据数学优化问题的标准描述{OP_descrpition}中，提取
    1.数学优化问题的目标函数表达式
    2.数学优化问题中的决策变量表达式,即需要优化的变量，注意决策变量不是常量。
    3.数学优化问题中的约束表达式
    4.参数表达式中出现的常量的具体数值，从用户参数{user_para}中得到需要参数数值
    5.参数表达式中变量的解释

    请严格按照以下JSON Schema{json_shema} 输出json格式的output

    请注意不要预设任何信息，只输出json格式的内容
    

    """

  modeling_refine_template : |
  
    """
    你是一名数学建模专家AI助手，请基于需要修正的建模参数 {modeling_parameters},数学问题描述 {OP_descrpition},用户参数{user_para}和修改意见{advices}重新提取修正建模参数,按照相同json格式重新输出修改后的modeling_parameter
    你需要从数学问题描述{OP_descrpition}重新提取的参数如下：
    1.数学优化问题的目标函数表达式
    2.数学优化问题中的决策变量表达式,即需要优化的变量，注意决策变量不是常量。
    3.数学优化问题中的约束表达式
    4.参数表达式中出现的常量的具体数值，从用户参数{user_para}中得到需要参数数值
    5.参数表达式中变量的解释
    严格按照以下JSON Schema{json_shema} 输出修改过的建模参数。
    
    请注意不要预设任何信息，只输出json格式的内容.
    """    

  modeling_check_template: |

    """

    你是一名数学建模专家AI评估助手，请判断提取到的建模参数{modeling_parameters}是否和数学问题描述{OP_descrpition}以及用户参数数值{user_para}匹配.如果匹配，请输出1并给出解释，如果不匹配，请提供解释以及修改意见，并输出0
    是否匹配的标准包括：
    1.建模表达式中的目标函数是否与数学问题描述{OP_descrpition}中的目标函数完全匹配
    2.决策变量是否与数学问题描述{OP_descrpition}中的决策变量匹配，通常情况下当前问题仅有1个决策变量
    3.约束条件是否和数学问题描述{OP_descrpition}中的参数完全匹配，请确保参数表达式中出现的数值与用户参数数值{user_para}匹配。。
    4.constant参数是否是完整，包含明确的数值，不要出现省略的情况，比如c = [0.75, 0.8, 0.78, 0.82, 0.85, 0.9, ...(user provided values)这种错误的省略表达
    5.参数解释是否符合数学问题的描述{OP_descrpition}.
    6.检查表达式是否具体，例如在输出结果中只出现表达式P是不正确的，需要具体P=...,具体表达式格式。

    请注意不要预设任何信息,严格按照以下JSON Schema{json_shema}输出prediction result和comment，不要输出其他解释信息。

    """
    
  code_template: |
    """
    你是一名代码专家，请根据建模参数{modeling_parameters},编写商用求解器gurobi能够理解的代码，得到最优解.
    请逐步解决这个问题，以下是编写gurobipy代码进行优化求解的步骤，请按照这个步骤生成代码：

    1.建立新模型，m = Model(name=“”), name是模型的名称, 返回值m是一个model对象，初始情况下没有变量和约束条件
    2.建立决策变量：m.addMVar ( shape, lb=0.0, ub=float('inf'), obj=0.0, vtype=GRB.BINARY, name="" )，其中shape是变量的维度，lb，ub为变量的上下限，默认值为0和float('inf')obj变量在目标函数中的系数。默认值为0.0，表示该变量在目标函数中不参与计算.vtype为决策变量的类型，默认值为`GRB.CONTINUOUS`，表示变量是连续的，可以设置为`GRB.BINARY`（二进制变量）、`GRB.INTEGER`（整数变量）,name为决策变量的名字
    3.设立优化目标函数：m.setObjective ( expr, sense=None ),expr为目标函数的表达式，比如obj = np.array([1.0, 1.0, 2.0])，m.setObjective(obj @ x, GRB.MAXIMIZE)，表示了maximize目标函数  x +   y + 2 z，sense代表了优化方向，最大化GRB.MAXIMIZE，或是最小化GRB.MINIMIZE 目标函数
    4.创建约束条件：m.addConstr ( constr, name="" ),为每个约束条件addConstr，其中constr是一个约束表达式，它定义了模型中的一个约束条件，例如x + y <= 1。name用于为添加的约束条件指定一个名称
    5.优化模型：m.optimize(),启动优化算法
    6.输出优化结果：例如 print(x.X)，print(f"Obj: {{m.ObjVal:g}}")

    请注意，这个问题中慢充功率为7，快充功率为13
    请输出你的代码块，example output format:
    ```python
    ...

    ```
    """

  code_check_template: |
    """
    你是一名数学优化问题与代码评估专家，请检查判断生成的代码{code_block}是否存在问题，
    是否正确的标准包括：
    1.代码是否与建模参数{modeling_parameters}匹配，
    2.代码是否存在语法运行问题。
    如果错误请按照格式请输出0，并给出修改意见。如果正确请按照格式输出1，并给出解释。
    请严格按照以下JSON Schema{json_shema} 输出评估结果以及修改意见与评论
    """
  
  code_refine_template: |
    """
    你是一个代码生成专家，请根据评估者提出的意见 {advices}和建模参数{modeling_parameter} 对代码块 {code_block} 进行更新，并重新输出更新后的代码块。

    请输出更新后的代码，example output format:

    ```python

   
    ```
    请注意修改代码输出时不要省略任何代码，完整的输出所有代码
    """


