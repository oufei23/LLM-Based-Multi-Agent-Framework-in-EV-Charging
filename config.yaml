math_problem:
  problem_1: |
    min $c P$,
    subject to:

    1. $\sum_{i=1}^{T} t^{f}_i$  $\leq T$
    2. $P= \sum_{i=1}^{T} x_{f} t^{f}_{i} \geq P_{req}$
    3. $C\leq C_b$

    where $c$ is real time changing electricity price, and dim(c) = T, and
    $t^f$ is time for fast charging, $t^{f}_{i}$ = [0,1], $0\leq i \leq T$, and $T = dim(t^f})$, and
    $x_f$ is a constant fast charging power, and
    $P_{req}$ is required energy for charging, and
    $C\leq C_b$, where $C_{b}$ is the budget of user

  problem_2: |
    min $c P$,
    subject to:

    1. $\sum_{i=1}^{T} t^{s}_i$  $\leq T$
    2. $P= \sum_{i=1}^{T} x_{s} t^{s}_{i} \geq P_{req}$
    3. $C\leq C_b$

    where $c$ is real time changing electricity price, and dim(c) = T, and
    $t^s$ is time for slow charging $t^{s}_{i}$ = [0,1], $0\leq i \leq T$, and $T = dim(t^s)$, and
    $x_s$ is a constant slow charging power, and
    $P_{req}$ is required energy for charging, and
    $C\leq C_b$, where $C_{b}$ is the budget of user

  benchmark_problem1: |
    \[
    \begin{aligned}
    \min_{x} & \quad w^\top x \\
    \text{s.t.} & \quad -\Delta T \cdot \mathbf{1}^\top x \leq -E_\text{req}, \\
           & \quad 0 \leq x \leq P_\text{max},
    \end{aligned}
    \]
    
    where \( x \in \mathbb{R}^n \) is the decision variable representing the charging power at each time step, \( w \in \mathbb{R}^n \) is the vector of electricity prices for the charging period, \( \Delta T \) is the duration (in hours) of each time step, \( \mathbf{1} \) is a vector of ones of size \( n \), \( E_\text{req} \) is the total energy required for charging (in kWh), and \( P_\text{max} \) is the maximum allowable charging power at any time step. The constraints ensure that the total energy delivered over the charging period satisfies the energy requirement (\( -\Delta T \cdot \mathbf{1}^\top x \leq -E_\text{req} \)), and that the charging power at each step stays within the bounds (\( 0 \leq x_i \leq P_\text{max}, \ \forall i = 1, \dots, n \)).